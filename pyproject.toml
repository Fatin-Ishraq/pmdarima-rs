[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pmdarima-rs"
requires-python = ">=3.10"
description = "Fast, drop-in ARIMA and auto-ARIMA for Python, powered by Rust"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Fatin Ishraq" }]
keywords = ["arima", "auto-arima", "time series", "forecasting", "pmdarima", "rust"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

# Deliberately short. `pmdarima` also pulls in statsmodels, scikit-learn,
# joblib, Cython and setuptools; none of those are needed here.
dependencies = ["numpy>=1.22", "pandas>=1.3", "scipy>=1.7"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest", "pmdarima>=2.1.1", "statsmodels>=0.14"]
plot = ["matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/Fatin-Ishraq/pmdarima-rs"
Repository = "https://github.com/Fatin-Ishraq/pmdarima-rs"
Issues = "https://github.com/Fatin-Ishraq/pmdarima-rs/issues"
Changelog = "https://github.com/Fatin-Ishraq/pmdarima-rs/blob/main/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "pmdarima_rs._pmdarima_rs"
features = ["pyo3/extension-module"]
