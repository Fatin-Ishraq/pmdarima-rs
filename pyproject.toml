[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pmdarima-rs"
requires-python = ">=3.10"
description = "Fast, drop-in ARIMA and auto-ARIMA for Python, powered by Rust"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Fatin Ishraq" }]
keywords = ["arima", "auto-arima", "time series", "forecasting", "pmdarima", "rust"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.22", "pandas>=1.3", "scipy>=1.7", "scikit-learn>=1.0"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest", "pmdarima>=2.1.1", "statsmodels>=0.14"]

[tool.maturin]
python-source = "python"
module-name = "pmdarima_rs._pmdarima_rs"
features = ["pyo3/extension-module"]
