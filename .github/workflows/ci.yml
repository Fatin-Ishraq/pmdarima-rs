name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `stable`. `-D warnings` against a rolling toolchain means
      # any Rust release can fail CI on unchanged code; bump this on purpose
      # rather than being surprised by it.
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib

  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Build and install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest numpy pandas scipy
          maturin build --release --out dist
          pip install --no-index --find-links dist pmdarima-rs

      - name: Install the reference implementation
        shell: bash
        # Nearly every test is differential against `pmdarima`. Where it
        # cannot be installed the suite skips those and still runs what
        # validates this package on its own. A missing reference must not fail
        # a build.
        run: |
          pip install "pmdarima>=2.1.1" statsmodels || \
            echo "::warning::reference unavailable here; differential tests will skip"

      - name: Test
        shell: bash
        run: pytest tests/ -q -rs

  wheels:
    name: wheels ${{ matrix.platform.os }} ${{ matrix.platform.target }}
    # Wheels for every platform are the whole point of a drop-in replacement:
    # if `pip install` has to compile, trying it is no longer free.
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, rust-tests, test, wheels, sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
