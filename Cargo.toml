[package]
name = "pmdarima-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Fast, drop-in ARIMA and auto-ARIMA for Python, powered by Rust"
license = "MIT"
repository = "https://github.com/Fatin-Ishraq/pmdarima-rs"

[lib]
name = "_pmdarima_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
numpy = "0.23"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
